name: Deploy Release

permissions:
  contents: write
  actions: read

on:
  workflow_run:
    workflows: ["Build"]
    branches: [main]
    types: [completed]

jobs:
  create-release:
    name: Create/Update Dev Release
    runs-on: ubuntu-26.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate Release Notes
        id: notes
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          BUILD_DATE=$(date -u +"%Y-%m-%d")
          BUILD_DATETIME=$(date -u +"%Y-%m-%d %H:%M UTC")

          RELEASE_TITLE="Cocoazu-${BUILD_DATE}-${SHORT_SHA}"
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV

          PREV_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "")

          if [ -n "$PREV_SHA" ]; then
            COMPARE_URL="${SERVER_URL}/${REPO}/compare/${PREV_SHA}...${COMMIT_SHA}"
          else
            COMPARE_URL="${SERVER_URL}/${REPO}/commit/${COMMIT_SHA}"
          fi

          cat <<EOF > release_notes.md
          ## OptiCraft Heritage Edition Cocoazú - Development Build

          Automated development binaries compiled from the latest repository updates.

          ### Commit Information
          - **Branch:** \`$BRANCH\`
          - **Commit Hash:** [\`$SHORT_SHA\`](${SERVER_URL}/${REPO}/commit/${COMMIT_SHA})
          - **Build Date:** $BUILD_DATETIME
          - **Build Log:** [View Workflow Run](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID})

          # What's Changed
          - **Commit Message:**
            \`\`\`text
            $COMMIT_MSG
            \`\`\`
          - **Comparing changes:** [Compare with previous commit](${COMPARE_URL})

          ---
          > **Important:** You must download the game resources and the compressed archive (\`.tar.gz\`) corresponding to your operating system and architecture from the assets list below.
          EOF

      - name: Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view dev-release --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit dev-release \
              --title "${{ env.RELEASE_TITLE }}" \
              --notes-file release_notes.md \
              --prerelease \
              --repo "${{ github.repository }}"
          else
            gh release create dev-release \
              --title "${{ env.RELEASE_TITLE }}" \
              --notes-file release_notes.md \
              --prerelease \
              --target main \
              --repo "${{ github.repository }}"
          fi

  deploy:
    name: Deploy ${{ matrix.platform }}
    needs: create-release
    runs-on: ubuntu-26.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows MinGW ───────────────────────────────────────────
          - platform: Windows x64 Generic (MinGW)
            artifact: opticraft-windows-x64-generic
            file: OptiCraft-windows-x64-generic.tar.gz
          - platform: Windows Zen 3 (MinGW)
            artifact: opticraft-windows-zen3
            file: OptiCraft-windows-zen3.tar.gz
          - platform: Windows Zen 4 (MinGW)
            artifact: opticraft-windows-zen4
            file: OptiCraft-windows-zen4.tar.gz

          # ── Linux x86/x64 Family ────────────────────────────────────
          - platform: Linux x64 Generic GCC
            artifact: opticraft-linux-x64-generic-gcc
            file: OptiCraft-linux-x64-generic-gcc.tar.gz
          - platform: Linux x86_64-v3 GCC
            artifact: opticraft-linux-x86_64-v3-gcc
            file: OptiCraft-linux-x86_64-v3-gcc.tar.gz
          - platform: Linux Zen 3 GCC
            artifact: opticraft-linux-zen3-gcc
            file: OptiCraft-linux-zen3-gcc.tar.gz
          - platform: Linux Zen 4 GCC
            artifact: opticraft-linux-zen4-gcc
            file: OptiCraft-linux-zen4-gcc.tar.gz

          # ── Linux ARM Family ────────────────────────────────────────
          - platform: Linux ARM64 GCC
            artifact: opticraft-linux-arm64-gcc
            file: OptiCraft-linux-arm64-gcc.tar.gz
          - platform: Linux ARMhf GCC
            artifact: opticraft-linux-armhf-gcc
            file: OptiCraft-linux-armhf-gcc.tar.gz
          - platform: Linux ARMv7 GCC
            artifact: opticraft-linux-armv7-gcc
            file: OptiCraft-linux-armv7-gcc.tar.gz

          # ── macOS Family ────────────────────────────────────────────
          - platform: macOS ARM64 Clang
            artifact: opticraft-macos-arm64-clang
            file: OptiCraft-macos-arm64-clang.tar.gz
          - platform: macOS x64 Clang
            artifact: opticraft-macos-x64-clang
            file: OptiCraft-macos-x64-clang.tar.gz

    steps:
      - name: Download ${{ matrix.artifact }} artifact
        uses: dawidd6/action-download-artifact@v24
        with:
          github_token: ${{ github.token }}
          workflow: build.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: ${{ matrix.artifact }}

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload dev-release \
            "${{ matrix.file }}" \
            --repo "${{ github.repository }}" \
            --clobber
