name: Deploy Release

permissions:
  contents: write
  actions: read

on:
  workflow_run:
    workflows: ["Build"]
    branches: [main]
    types: [completed]

jobs:
  create-release:
    name: Create/Update Dev Release
    runs-on: ubuntu-26.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          if gh release view dev-release --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit dev-release \
              --title "Development Release" \
              --notes "$COMMIT_MSG" \
              --prerelease \
              --repo "${{ github.repository }}"
          else
            gh release create dev-release \
              --title "Development Release" \
              --notes "$COMMIT_MSG" \
              --prerelease \
              --target main \
              --repo "${{ github.repository }}"
          fi

  deploy:
    name: Deploy ${{ matrix.platform }}
    needs: create-release
    runs-on: ubuntu-26.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64 (MinGW)
            artifact: opticraft-windows-x64
            file: OptiCraft-windows-x64.tar.gz
          - platform: Linux x64 GCC
            artifact: opticraft-linux-x64-gcc
            file: OptiCraft-linux-x64-gcc.tar.gz
          - platform: macOS ARM64 Clang
            artifact: opticraft-macos-arm64-clang
            file: OptiCraft-macos-arm64-clang.tar.gz
          - platform: macOS x64 Clang
            artifact: opticraft-macos-x64-clang
            file: OptiCraft-macos-x64-clang.tar.gz
    steps:
      - name: Download ${{ matrix.artifact }} artifact
        uses: dawidd6/action-download-artifact@v24
        with:
          github_token: ${{ github.token }}
          workflow: build.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: ${{ matrix.artifact }}

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload dev-release \
            "${{ matrix.file }}" \
            --repo "${{ github.repository }}" \
            --clobber