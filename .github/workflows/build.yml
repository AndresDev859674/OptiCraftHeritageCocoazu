name: Build

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ── Windows MinGW (x64 & ARM64) ──────────────────────────────────────
  build-windows-mingw:
    timeout-minutes: 45
    name: Windows ${{ matrix.arch }} (MinGW)
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            compiler_prefix: x86_64-w64-mingw32
            pkg_name: mingw-w64
          - arch: arm64
            compiler_prefix: aarch64-w64-mingw32
            pkg_name: gcc-mingw-w64-aarch64 g++-mingw-w64-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone SDL_net (pinned)
        run: |
          if [ ! -f external/SDL_net/CMakeLists.txt ]; then
            echo "Cloning SDL_net..."
            git clone --depth 1 https://github.com/libsdl-org/SDL_net.git external/SDL_net
            git -C external/SDL_net fetch --depth 1 origin b1085eed744eab0c894a5306d822c9241bcf0228
            git -C external/SDL_net checkout FETCH_HEAD
          fi

      - name: Install build tools & MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache ${{ matrix.pkg_name }}

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-windows-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-windows-${{ matrix.arch }}-

      - name: Configure ccache
        run: ccache --max-size=2G && ccache --set-config=compression=true

      - name: Configure
        run: |
          cmake -B build/win-${{ matrix.arch }} -G "Ninja" \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=${{ matrix.compiler_prefix }}-gcc \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler_prefix }}-g++ \
            -DSDL_PIPEWIRE=OFF \
            -DPC_LEGACY_BUILD=ON \
            -DSDL2NET_SAMPLES=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_CXX_FLAGS=-I$GITHUB_WORKSPACE/src/net/minecraft/src" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/win-${{ matrix.arch }} -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist
          EXE_PATH=$(find build/win-${{ matrix.arch }} bin -type f -name "OptiCraft.exe" -not -path "*/CMakeFiles/*" | head -n 1)
          cp "$EXE_PATH" dist/OptiCraft-windows-${{ matrix.arch }}.exe
          tar -C dist -czf OptiCraft-windows-${{ matrix.arch }}.tar.gz OptiCraft-windows-${{ matrix.arch }}.exe

      - uses: actions/upload-artifact@v7
        with:
          name: opticraft-windows-${{ matrix.arch }}
          path: OptiCraft-windows-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache --show-stats

  # ── Linux x86 & x64 Microarchitectures (Generic, x86_64-v3, Zen 3, Zen 4, x86 32-bit) ──
  build-linux-x86-family:
    timeout-minutes: 45
    name: Linux ${{ matrix.name }} GCC
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64 Generic
            id: x64-generic
            cxx_flags: ""
            multilib: false
            use_preset: false
          - name: x86 32-bit
            id: x86-32bit
            cxx_flags: "-m32"
            multilib: true
            use_preset: true
          - name: x86_64-v3
            id: x86_64-v3
            cxx_flags: "-march=x86-64-v3"
            multilib: false
            use_preset: false
          - name: Zen 3
            id: zen3
            cxx_flags: "-march=znver3"
            multilib: false
            use_preset: false
          - name: Zen 4
            id: zen4
            cxx_flags: "-march=znver4"
            multilib: false
            use_preset: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone SDL_net (pinned)
        run: |
          if [ ! -f external/SDL_net/CMakeLists.txt ]; then
            echo "Cloning SDL_net..."
            git clone --depth 1 https://github.com/libsdl-org/SDL_net.git external/SDL_net
            git -C external/SDL_net fetch --depth 1 origin b1085eed744eab0c894a5306d822c9241bcf0228
            git -C external/SDL_net checkout FETCH_HEAD
          fi

      - name: Install build tools & dependencies
        run: |
          if [ "${{ matrix.multilib }}" = "true" ]; then
            sudo dpkg --add-architecture i386
          fi
          sudo apt-get update
          EXTRA_PKGS=""
          if [ "${{ matrix.multilib }}" = "true" ]; then
            EXTRA_PKGS="gcc-multilib g++-multilib libgl-dev:i386 libx11-dev:i386 libxext-dev:i386 libasound2-dev:i386"
          else
            EXTRA_PKGS="libgl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libasound2-dev"
          fi
          sudo apt-get install -y ninja-build ccache $EXTRA_PKGS

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ matrix.id }}-

      - name: Configure ccache
        run: ccache --max-size=2G && ccache --set-config=compression=true

      - name: Configure
        run: |
          PRESET_ARGS=""
          if [ "${{ matrix.use_preset }}" = "true" ]; then
            PRESET_ARGS="--preset gcc32-legacy-release"
          fi
          cmake -B build/linux-${{ matrix.id }} -G "Ninja" $PRESET_ARGS \
            -DSDL_PIPEWIRE=OFF \
            -DPC_LEGACY_BUILD=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_CXX_FLAGS=-I$GITHUB_WORKSPACE/src/net/minecraft/src ${{ matrix.cxx_flags }}" \
            "-DCMAKE_C_FLAGS=${{ matrix.cxx_flags }}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/linux-${{ matrix.id }} -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist
          BIN_PATH=$(find build/linux-${{ matrix.id }} bin -type f -name "OptiCraft" -not -path "*/CMakeFiles/*" | head -n 1)
          cp "$BIN_PATH" dist/OptiCraft-linux-${{ matrix.id }}-gcc
          tar -C dist -czf OptiCraft-linux-${{ matrix.id }}-gcc.tar.gz OptiCraft-linux-${{ matrix.id }}-gcc

      - uses: actions/upload-artifact@v7
        with:
          name: opticraft-linux-${{ matrix.id }}-gcc
          path: OptiCraft-linux-${{ matrix.id }}-gcc.tar.gz
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache --show-stats

  # ── Linux ARM Cross-Compilation (ARM64, ARMhf, ARMv7) ───────────────
  build-linux-arm-family:
    timeout-minutes: 45
    name: Linux ${{ matrix.name }} GCC
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            id: arm64
            compiler_prefix: aarch64-linux-gnu
            arch_flags: ""
          - name: ARMhf (Generic)
            id: armhf
            compiler_prefix: arm-linux-gnueabihf
            arch_flags: ""
          - name: ARMv7-A NEON
            id: armv7
            compiler_prefix: arm-linux-gnueabihf
            arch_flags: "-march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone SDL_net (pinned)
        run: |
          if [ ! -f external/SDL_net/CMakeLists.txt ]; then
            echo "Cloning SDL_net..."
            git clone --depth 1 https://github.com/libsdl-org/SDL_net.git external/SDL_net
            git -C external/SDL_net fetch --depth 1 origin b1085eed744eab0c894a5306d822c9241bcf0228
            git -C external/SDL_net checkout FETCH_HEAD
          fi

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache \
            gcc-${{ matrix.compiler_prefix }} g++-${{ matrix.compiler_prefix }}

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ matrix.id }}-

      - name: Configure ccache
        run: ccache --max-size=2G && ccache --set-config=compression=true

      - name: Configure
        run: |
          cmake -B build/linux-${{ matrix.id }} -G "Ninja" \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.id }} \
            -DCMAKE_C_COMPILER=${{ matrix.compiler_prefix }}-gcc \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler_prefix }}-g++ \
            -DSDL_PIPEWIRE=OFF \
            -DSDL_VIDEO_DRIVER_X11=OFF \
            -DSDL_VIDEO_DRIVER_WAYLAND=OFF \
            -DPC_LEGACY_BUILD=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_CXX_FLAGS=-I$GITHUB_WORKSPACE/src/net/minecraft/src ${{ matrix.arch_flags }}" \
            "-DCMAKE_C_FLAGS=${{ matrix.arch_flags }}" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/linux-${{ matrix.id }} -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist
          BIN_PATH=$(find build/linux-${{ matrix.id }} bin -type f -name "OptiCraft" -not -path "*/CMakeFiles/*" | head -n 1)
          cp "$BIN_PATH" dist/OptiCraft-linux-${{ matrix.id }}-gcc
          tar -C dist -czf OptiCraft-linux-${{ matrix.id }}-gcc.tar.gz OptiCraft-linux-${{ matrix.id }}-gcc

      - uses: actions/upload-artifact@v7
        with:
          name: opticraft-linux-${{ matrix.id }}-gcc
          path: OptiCraft-linux-${{ matrix.id }}-gcc.tar.gz
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache --show-stats

  # ── macOS ARM64 / x64 ───────────────────────────────────────────────
  build-macos:
    timeout-minutes: 45
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64 Clang
            runner: macos-26
            suffix: arm64
            arch: arm64
            target: '11.0'
            brew_prefix: '/opt/homebrew'
          - name: macOS x64 Clang
            runner: macos-26-intel
            suffix: x64
            arch: x86_64
            target: '10.15'
            brew_prefix: '/usr/local'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone SDL_net (pinned)
        run: |
          if [ ! -f external/SDL_net/CMakeLists.txt ]; then
            echo "Cloning SDL_net..."
            git clone --depth 1 https://github.com/libsdl-org/SDL_net.git external/SDL_net
            git -C external/SDL_net fetch --depth 1 origin b1085eed744eab0c894a5306d822c9241bcf0228
            git -C external/SDL_net checkout FETCH_HEAD
          fi

      - name: Install build tools & SDL2
        run: brew install ninja ccache sdl2 sdl2_net

      - name: Configure ccache dir
        run: echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-macos-${{ matrix.suffix }}-${{ github.run_id }}
          restore-keys: |
            ccache-macos-${{ matrix.suffix }}-

      - name: Configure ccache
        run: ccache --max-size=2G && ccache --set-config=compression=true

      - name: Configure
        run: |
          cmake -B build/macos -G "Ninja" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_PREFIX_PATH="${{ matrix.brew_prefix }}" \
            -DSDL_PIPEWIRE=OFF \
            -DPC_LEGACY_BUILD=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.target }} \
            "-DCMAKE_CXX_FLAGS=-I$GITHUB_WORKSPACE/src/net/minecraft/src -I${{ matrix.brew_prefix }}/include" \
            "-DCMAKE_EXE_LINKER_FLAGS=-L${{ matrix.brew_prefix }}/lib" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/macos -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          mkdir -p dist
          BIN_PATH=$(find build/macos bin -type f -name "OptiCraft" -not -path "*/CMakeFiles/*" | head -n 1)
          cp "$BIN_PATH" dist/OptiCraft-macos-${{ matrix.suffix }}-clang
          tar -C dist -czf OptiCraft-macos-${{ matrix.suffix }}-clang.tar.gz OptiCraft-macos-${{ matrix.suffix }}-clang

      - uses: actions/upload-artifact@v7
        with:
          name: opticraft-macos-${{ matrix.suffix }}-clang
          path: OptiCraft-macos-${{ matrix.suffix }}-clang.tar.gz
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache --show-stats
