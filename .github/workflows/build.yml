name: Build

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ── Windows x64 (MinGW Cross-Compilation using linux) ───────────────
  build-windows-mingw:
    timeout-minutes: 45
    name: Windows x64 (MinGW)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone SDL_net (pinned)
        run: |
          if [ ! -f external/SDL_net/CMakeLists.txt ]; then
            echo "Cloning SDL_net..."
            git clone --depth 1 https://github.com/libsdl-org/SDL_net.git external/SDL_net
            git -C external/SDL_net fetch --depth 1 origin b1085eed744eab0c894a5306d822c9241bcf0228
            git -C external/SDL_net checkout FETCH_HEAD
          fi

      - name: Install build tools & MinGW
        run: |
          sudo apt update
          sudo apt install -y ninja-build ccache mingw-w64

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-windows-mingw-${{ github.run_id }}
          restore-keys: |
            ccache-windows-mingw-

      - name: Configure ccache
        run: ccache --max-size=2G && ccache --set-config=compression=true

      - name: Configure
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DSDL_PIPEWIRE=OFF \
            -DPC_LEGACY_BUILD=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            --preset linux-release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist
          cp bin/Debug/OptiCraft.exe dist/OptiCraft-windows-x64.exe || cp build/OptiCraft.exe dist/OptiCraft-windows-x64.exe
          tar -C dist -czf OptiCraft-windows-x64.tar.gz OptiCraft-windows-x64.exe

      - uses: actions/upload-artifact@v7
        with:
          name: opticraft-windows-x64
          path: OptiCraft-windows-x64.tar.gz
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache --show-stats

  # ── Linux x64 GCC ────────────────────────────────────────────────────
  build-linux-x64-gcc:
    timeout-minutes: 45
    name: Linux x64 GCC
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone SDL_net (pinned)
        run: |
          if [ ! -f external/SDL_net/CMakeLists.txt ]; then
            echo "Cloning SDL_net..."
            git clone --depth 1 https://github.com/libsdl-org/SDL_net.git external/SDL_net
            git -C external/SDL_net fetch --depth 1 origin b1085eed744eab0c894a5306d822c9241bcf0228
            git -C external/SDL_net checkout FETCH_HEAD
          fi

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y ninja-build ccache \
            libgl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libasound2-dev

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-linux-x64-${{ github.run_id }}
          restore-keys: |
            ccache-linux-x64-

      - name: Configure ccache
        run: ccache --max-size=2G && ccache --set-config=compression=true

      - name: Configure
        run: |
          cmake -B build -G "Ninja" \
            -DSDL_PIPEWIRE=OFF \
            -DPC_LEGACY_BUILD=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            --preset linux-release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist
          cp bin/Release/OptiCraft dist/OptiCraft-linux-x64-gcc || cp build/OptiCraft dist/OptiCraft-linux-x64-gcc
          tar -C dist -czf OptiCraft-linux-x64-gcc.tar.gz OptiCraft-linux-x64-gcc

      - uses: actions/upload-artifact@v7
        with:
          name: opticraft-linux-x64-gcc
          path: OptiCraft-linux-x64-gcc.tar.gz
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache --show-stats

  # ── macOS ARM64 / x64 ───────────────────────────────────────────────
  build-macos:
    timeout-minutes: 45
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64 Clang
            runner: macos-26
            suffix: arm64
            arch: arm64
            target: '11.0'
          - name: macOS x64 Clang
            runner: macos-26-intel
            suffix: x64
            arch: x86_64
            target: '10.15'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Clone SDL_net (pinned)
        run: |
          if [ ! -f external/SDL_net/CMakeLists.txt ]; then
            echo "Cloning SDL_net..."
            git clone --depth 1 https://github.com/libsdl-org/SDL_net.git external/SDL_net
            git -C external/SDL_net fetch --depth 1 origin b1085eed744eab0c894a5306d822c9241bcf0228
            git -C external/SDL_net checkout FETCH_HEAD
          fi

      - name: Install build tools
        run: brew install ninja ccache

      - name: Configure ccache dir
        run: echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-macos-${{ matrix.suffix }}-${{ github.run_id }}
          restore-keys: |
            ccache-macos-${{ matrix.suffix }}-

      - name: Configure ccache
        run: ccache --max-size=2G && ccache --set-config=compression=true

      - name: Configure
        run: |
          cmake -B build -G "Ninja" \
            -DSDL_PIPEWIRE=OFF \
            -DPC_LEGACY_BUILD=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            --preset linux-release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.target }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist
          cp bin/Release/OptiCraft dist/OptiCraft-macos-${{ matrix.suffix }}-clang || cp build/OptiCraft dist/OptiCraft-macos-${{ matrix.suffix }}-clang
          tar -C dist -czf OptiCraft-macos-${{ matrix.suffix }}-clang.tar.gz OptiCraft-macos-${{ matrix.suffix }}-clang

      - uses: actions/upload-artifact@v7
        with:
          name: opticraft-macos-${{ matrix.suffix }}-clang
          path: OptiCraft-macos-${{ matrix.suffix }}-clang.tar.gz
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache --show-stats